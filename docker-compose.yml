  #   image: nvcr.io/nvidia/vst:latest
  #   container_name: vst
  #   runtime: nvidia
  #   ports:
  #     - "30101:30101"
  #   environment:
  #     - NGC_API_KEY=${NGC_CLI_API_KEY:?err}
  #   volumes:
  #     - vss-uploads:/workspace/uploads
  #   networks:
  #     - vss-net

  # ──────────────────────────────────────────────
  # NIM model services (alternative to vLLM, for H100/A100 80GB).
  # See ./models/vlm and ./models/llm for declarative specs.
  # Set LLM_MODEL_TYPE=nim + VLM_MODEL_TYPE=nim in .env to switch.
  # ──────────────────────────────────────────────
  # vss-vlm-nim:
  #   image: ${VLM_NIM_IMAGE:-nvcr.io/nim/nvidia/cosmos3-reasoner:1.7}
  #   container_name: vss-vlm-nim
  #   runtime: nvidia
  #   shm_size: 32gb
  #   ports:
  #     - "${VLM_PORT:-30082}:8000"
  #   environment:
  #     - NGC_API_KEY=${NGC_CLI_API_KEY:?NGC_CLI_API_KEY required}
  #     - NIM_MODEL_NAME=${VLM_NIM_MODEL_NAME:-cosmos3-reasoner}
  #   volumes:
  #     - cosmos3_reasoner_cache:/opt/nim/.cache
  #   networks:
  #     - vss-net
  #
  # vss-llm-nim:
  #   image: ${LLM_NIM_IMAGE:-nvcr.io/nim/nvidia/nemotron-3.5-lightning-30b-a3b:2.0.9-variant}
  #   container_name: vss-llm-nim
  #   runtime: nvidia
  #   shm_size: 16GB
  #   ports:
  #     - "${LLM_PORT:-30081}:8000"
  #   environment:
  #     - NGC_API_KEY=${NGC_CLI_API_KEY:?NGC_CLI_API_KEY required}
  #     - NIM_MODEL_NAME=${LLM_NIM_MODEL_NAME:-nvidia/nemotron-3.5-lightning-30b-a3b}
  #     - NIM_SERVED_MODEL_NAME=${LLM_NIM_SERVED_MODEL_NAME:-nvidia/nemotron-3.5-lightning-30b-a3b}
  #   volumes:

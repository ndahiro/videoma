  #   networks:
  #     - vss-net

volumes:
  vss-uploads:
  vss-auth-data:
  vss-video-storage:
  vss-redis-data:
  ollama-models:
  vllm_llm_cache:
  vllm_vlm_cache:
  cosmos3_reasoner_cache:
  nemotron_3_5_lightning_cache:

networks:
  vss-net:
    driver: bridge

packages:
  - ui/apps/vss-ui
  - lib/*
  - lib/integrations/*
  - scripts

allowBuilds:
  esbuild: true
  ffmpeg-static: true
  sharp: true

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.1.6
  '@tanstack/react-query': ^5.62.0
  '@types/node': ^22.15.11
  '@types/react': ^19.1.4
  '@types/react-dom': ^19.1.4
  drizzle-kit: ^0.31.10
  drizzle-orm: 0.31.4
  orval: ^8.9.1
  react: 19.1.0
  react-dom: 19.1.0
  tailwindcss: ^4.1.6
  typescript: ~5.9.3
  vite: ^6.4.4
  zod: ~3.24.1

minimumReleaseAge: '1440'

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

overrides:
  '@esbuild/freebsd-x64': '*'
  '@esbuild/linux-arm': '*'
  '@esbuild/linux-arm64': '*'
  '@esbuild/linux-ia32': '*'
  '@esbuild/linux-loong64': '*'
  '@esbuild/linux-ppc64': '*'
  '@esbuild/linux-x64': '*'
  '@esbuild/netbsd-x64': '*'
  '@esbuild/openbsd-x64': '*'
  '@esbuild/sunos-x64': '*'
  '@rollup/rollup-darwin-arm64': '*'
  '@rollup/rollup-darwin-x64': '*'
  '@rollup/rollup-linux-x64-gnu': '*'
  '@rollup/rollup-linux-x64-musl': '*'
  '@rollup/rollup-win32-x64-msvc': '*'
  '@swc/core-darwin-arm64': '*'
  '@swc/core-darwin-x64': '*'
  '@swc/core-linux-x64-gnu': '*'
  '@swc/core-linux-x64-musl': '*'
  '@swc/core-win32-x64-msvc': '*'
  esbuild: 0.27.3
  lightningcss-darwin-arm64: '*'
  lightningcss-darwin-x64: '*'
  lightningcss-linux-x64-gnu: '*'
  lightningcss-linux-x64-musl: '*'
  lightningcss-win32-x64-msvc: '*'
  unrs-resolver-darwin-arm64: '*'
  unrs-resolver-darwin-x64: '*'
  unrs-resolver-linux-x64-gnu: '*'

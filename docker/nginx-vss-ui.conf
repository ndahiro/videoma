# vss-ui load balancer — nginx in front of the scaled `vss-ui` replicas.
#
#   docker compose up --scale vss-ui=3
#
# The `set` + variable proxy_pass pattern re-resolves the `vss-ui` DNS name
# through Docker's embedded resolver on every request batch, so replicas
# added/removed by --scale join/leave rotation without an nginx reload
# (plain `upstream` blocks resolve only at startup). No sticky sessions:
# auth is stateless JWT (cookie + bearer) and shared state lives in
# Postgres/Redis/shared volume.

upstream vss_ui {
    # Fallback for cold start; the location blocks below resolve dynamically.
    server vss-ui:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # Video uploads: 5 files / 1 GiB per request (see upload route caps).
    client_max_body_size 1100m;
    client_body_timeout 300s;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/healthz {
        set $vss_ui_upstream vss-ui;
        proxy_pass http://$vss_ui_upstream:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        set $vss_ui_upstream vss-ui;
        proxy_pass http://$vss_ui_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Uploads + inline embedding runs are slow; fail over to a healthy
        # replica on errors/timeouts rather than dropping the client.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 60s;
        proxy_next_upstream_tries 3;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 4;
    gzip_vary on;
}

# VSS Blueprint — Nginx Configuration
# Serves the VSS UI and proxies API requests to the VSS Agent
# The restored agent uses nat serve on port 8000

upstream vss_agent {
    server vss-agent:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 4G;

    # ── API Proxy ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://vss_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ── Health endpoint ────────────────────────────────────────────
    location /health {
        proxy_pass http://vss_agent/health;
        proxy_set_header Host $host;
    }

    # ── Static UI ──────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── Compression ────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;
}

openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Video Search & Summarization API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: videos
    description: Video management
  - name: search
    description: Search and query
  - name: jobs
    description: Processing jobs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List all ingested videos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"

  /videos/upload:
    post:
      operationId: uploadVideo
      tags: [videos]
      summary: Upload one or more video files (multipart/form-data handled directly)
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Upload accepted, processing started
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"

  /videos/folder:
    post:
      operationId: ingestFolder
      tags: [videos]
      summary: Ingest all videos from a server-side folder path
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "202":
          description: Folder ingestion started
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"

  /videos/{videoId}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get video details
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Video details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /videos/{videoId}/process:
    post:
      operationId: processVideo
      tags: [videos]
      summary: Trigger embedding/processing for a video
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /search:
    post:
      operationId: searchVideos
      tags: [search]
      summary: Natural language search across all videos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInput"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /query:
    post:
      operationId: queryVideos
      tags: [search]
      summary: Ask a question about specific video(s) or all videos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryInput"
      responses:
        "200":
          description: Query answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"

  /summarize:
    post:
      operationId: summarizeVideo
      tags: [search]
      summary: Generate a summary of a video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizeInput"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResult"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all processing jobs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /stats:
    get:
      operationId: getStats
      tags: [health]
      summary: Get pipeline statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
        vss_agent:
          type: string
        version:
          type: string

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthToken:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        username:
          type: string

    User:
      type: object
      required: [username]
      properties:
        username:
          type: string
        role:
          type: string

    Video:
      type: object
      required: [id, name, status, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: ["string", "null"]
        size_bytes:
          type: ["integer", "null"]
        duration_seconds:
          type: ["number", "null"]
        status:
          type: string
          enum: [pending, processing, ready, error]
        error:
          type: ["string", "null"]
        thumbnail_url:
          type: ["string", "null"]
        created_at:
          type: string
        updated_at:
          type: string

    FolderInput:
      type: object
      required: [folder_path]
      properties:
        folder_path:
          type: string
          description: Absolute or relative path to video folder on the server

    Job:
      type: object
      required: [id, video_id, status, created_at]
      properties:
        id:
          type: string
        video_id:
          type: string
        video_name:
          type: string
        type:
          type: string
          enum: [embedding, ingest, summarize]
        status:
          type: string
          enum: [queued, running, done, error]
        progress:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
        created_at:
          type: string
        updated_at:
          type: string

    SearchInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Natural language search query
        video_ids:
          type: array
          items:
            type: string
          description: Optional subset of video IDs to search within
        top_k:
          type: integer
          default: 5

    SearchResult:
      type: object
      required: [query, results]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        elapsed_ms:
          type: ["number", "null"]

    SearchHit:
      type: object
      required: [video_id, video_name, score]
      properties:
        video_id:
          type: string
        video_name:
          type: string
        score:
          type: number
        timestamp_start:
          type: ["number", "null"]
        timestamp_end:
          type: ["number", "null"]
        description:
          type: ["string", "null"]
        thumbnail_url:
          type: ["string", "null"]

    QueryInput:
      type: object
      required: [question]
      properties:
        question:
          type: string
        video_ids:
          type: array
          items:
            type: string

    QueryResult:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        elapsed_ms:
          type: ["number", "null"]

    SummarizeInput:
      type: object
      required: [video_id]
      properties:
        video_id:
          type: string
        style:
          type: string
          enum: [brief, detailed, bullet_points]
          default: detailed

    SummaryResult:
      type: object
      required: [video_id, summary]
      properties:
        video_id:
          type: string
        video_name:
          type: string
        summary:
          type: string
        elapsed_ms:
          type: ["number", "null"]

    Stats:
      type: object
      properties:
        total_videos:
          type: integer
        ready_videos:
          type: integer
        processing_videos:
          type: integer
        error_videos:
          type: integer
        total_jobs:
          type: integer
        active_jobs:
          type: integer

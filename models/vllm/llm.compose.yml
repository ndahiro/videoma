#
# Self-hosted vLLM serving nvidia/NVIDIA-Nemotron-Nano-9B-v2-FP8 for the VSS agent.
# FP8 weights ≈ 9 GB; comfortable on a 16 GB+ GPU.
#
# The Nemotron-Nano-V2 release notes require vLLM ≥ 25.12 for tool calling,
# which corresponds to the vllm/vllm-openai image below.
#
# Bring up:   docker compose -f models/vllm/llm.compose.yml up -d
# Tear down:  docker compose -f models/vllm/llm.compose.yml down
#
# Once up, point the agent at it:
#   LLM_MODEL_TYPE=openai
#   LLM_NAME=nvidia/NVIDIA-Nemotron-Nano-9B-v2-FP8
#   LLM_BASE_URL=http://vss-llm-vllm:8000/v1

services:
  vss-llm-vllm:
    image: vllm/vllm-openai:v0.6.6.post1
    container_name: vss-llm-vllm
    runtime: nvidia
    shm_size: 16gb
    ports:
      - "${LLM_VLLM_PORT:-30092}:8000"
    volumes:
      - vllm_llm_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      VLLM_GPU_MEM_UTIL: "0.85"
    command:
      - --model=nvidia/NVIDIA-Nemotron-Nano-9B-v2-FP8
      - --host=0.0.0.0
      - --port=8000
      - --dtype=auto
      - --max-model-len=16384
      - --gpu-memory-utilization=0.85
      - --trust-remote-code
      - --served-model-name=nvidia/NVIDIA-Nemotron-Nano-9B-v2-FP8
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              device_ids: ["${LLM_VLLM_DEVICE_ID:-0}"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 600s
    restart: unless-stopped
    networks:
      - vss-net

volumes:
  vllm_llm_cache:

networks:
  vss-net:
    external: true
    name: video-insight-hub_vss-net
